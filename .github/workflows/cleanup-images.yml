name: Cleanup Old Docker Images

on:
  schedule:
  # Run weekly at 2 AM UTC on Sundays
  - cron: '0 2 * * 0'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no deletions)'
        required: false
        default: false
        type: boolean

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Cleanup feature branch images
      uses: actions/github-script@v7
      with:
        script: |
          const dryRun = '${{ github.event.inputs.dry_run }}' === 'true';
          const owner = context.repo.owner;
          const packageName = 'custom-otel-collector';

          console.log(`Starting cleanup for ${owner}/${packageName}`);
          if (dryRun) {
            console.log('🔍 Running in DRY-RUN mode - no images will be deleted');
          }

          try {
            // Get all package versions
            const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
              package_type: 'container',
              package_name: packageName,
              username: owner,
              per_page: 100
            });
            
            console.log(`Found ${versions.length} package versions`);
            
            const now = new Date();
            const sevenDaysAgo = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));
            
            let deletedCount = 0;
            
            for (const version of versions) {
              const createdAt = new Date(version.created_at);
              const tags = version.metadata?.container?.tags || [];
              
              // Skip if no tags (should not happen)
              if (tags.length === 0) continue;
              
              const isMainBranch = tags.some(tag => 
                tag === 'latest' || 
                /^v?\d+\.\d+\.\d+$/.test(tag)
              );
              
              const isFeatureBranch = tags.some(tag => 
                tag.includes('-') && 
                !tag.startsWith('v') && 
                tag !== 'latest'
              );
              
              let shouldDelete = false;
              let reason = '';
              
              if (isFeatureBranch && createdAt < sevenDaysAgo) {
                shouldDelete = true;
                reason = 'Feature branch image older than 7 days';
              }
              // Never delete main branch images - they are kept permanently
              
              if (shouldDelete) {
                console.log(`${dryRun ? '[DRY-RUN] Would delete' : 'Deleting'}: ${tags.join(', ')} (ID: ${version.id}, Created: ${createdAt.toISOString()}) - ${reason}`);
                
                if (!dryRun) {
                  try {
                    await github.rest.packages.deletePackageVersionForUser({
                      package_type: 'container',
                      package_name: packageName,
                      username: owner,
                      package_version_id: version.id
                    });
                    deletedCount++;
                  } catch (error) {
                    console.error(`Failed to delete version ${version.id}:`, error.message);
                  }
                }
              } else {
                console.log(`Keeping: ${tags.join(', ')} (Created: ${createdAt.toISOString()})`);
              }
            }
            
            console.log(`${dryRun ? 'Would have deleted' : 'Deleted'} ${deletedCount} package versions`);
            
          } catch (error) {
            console.error('Error during cleanup:', error);
            throw error;
          }

  cleanup-untagged:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Delete untagged images
      uses: actions/github-script@v7
      with:
        script: |
          const dryRun = '${{ github.event.inputs.dry_run }}' === 'true';
          const owner = context.repo.owner;
          const packageName = 'custom-otel-collector';

          console.log(`Cleaning up untagged images for ${owner}/${packageName}`);
          if (dryRun) {
            console.log('🔍 Running in DRY-RUN mode - no images will be deleted');
          }

          try {
            const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
              package_type: 'container',
              package_name: packageName,
              username: owner,
              per_page: 100
            });
            
            const untaggedVersions = versions.filter(version => {
              const tags = version.metadata?.container?.tags || [];
              return tags.length === 0;
            });
            
            console.log(`Found ${untaggedVersions.length} untagged versions`);
            
            for (const version of untaggedVersions) {
              const createdAt = new Date(version.created_at);
              console.log(`${dryRun ? '[DRY-RUN] Would delete' : 'Deleting'} untagged version: ${version.id} (Created: ${createdAt.toISOString()})`);
              
              if (!dryRun) {
                try {
                  await github.rest.packages.deletePackageVersionForUser({
                    package_type: 'container',
                    package_name: packageName,
                    username: owner,
                    package_version_id: version.id
                  });
                } catch (error) {
                  console.error(`Failed to delete untagged version ${version.id}:`, error.message);
                }
              }
            }
            
          } catch (error) {
            console.error('Error during untagged cleanup:', error);
            throw error;
          }
